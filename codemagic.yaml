workflows:
  keter-reuven-ios:
    name: Keter Reuven iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: keter-apple

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: il.co.keter-reuven.app
      vars:
        XCODE_WORKSPACE: "כתר ראובן.xcworkspace"
        XCODE_SCHEME: "כתר ראובן"
      xcode: latest

    scripts:
            - name: Unpack iOS source
        script: |
          cd "$CM_BUILD_DIR"
          rm -rf src KeterReuven-iOS-CarPlay-1012-DEV-SOURCE
          unzip -oq KeterReuven-iOS-CarPlay-1012-DEV-SOURCE.zip -d "$CM_BUILD_DIR"
          mv KeterReuven-iOS-CarPlay-1012-DEV-SOURCE/src src
          sed -i '' \
            -e 's/CURRENT_PROJECT_VERSION = 5;/CURRENT_PROJECT_VERSION = 6;/g' \
            -e 's/MARKETING_VERSION = 1.1.0;/MARKETING_VERSION = 1.1.1;/g' \
            src/*.xcodeproj/project.pbxproj

      - name: Set up code signing
        script: |
          cd "$CM_BUILD_DIR/src"
          xcode-project use-profiles

      - name: Build IPA for App Store
        script: |
          cd "$CM_BUILD_DIR/src"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/src/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
